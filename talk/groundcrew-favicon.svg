<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="groundcrew">
  <title>groundcrew</title>
  <!--
    Favicon/emoji cut of the sign tile: the inscription border is dropped
    and the fork stroke bumped from 11 to 16 so it stays legible at tiny
    sizes (16px favicon, ~22px Slack emoji). Same geometry otherwise as
    groundcrew-mark.svg.

    Regenerate groundcrew-favicon.png with the sips commands in the
    README's Development section.
  -->
