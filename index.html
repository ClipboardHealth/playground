<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playground Index</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --ink: #181818;
      --muted: #686868;
      --line: #d7d7d0;
      --accent: #0f766e;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    nav {
      display: grid;
      gap: 12px;
      margin-top: 32px;
    }

    a {
      display: block;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      border-color: var(--accent);
    }

    strong {
      display: block;
      margin-bottom: 4px;
      font-size: 18px;
    }

    span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101010;
        --panel: #171717;
        --ink: #f1f1ef;
        --muted: #a0a09a;
        --line: #2e2e2a;
        --accent: #2dd4bf;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Playground</h1>
    <p>Local pages in this repo.</p>

    <nav aria-label="Playground pages">
      <a href="work-life-in-weeks.html">
        <strong>Your Work Life in Weeks</strong>
        <span>The original playground page moved out of the root index.</span>
      </a>

      <a href="groundcrew-brand.html">
        <strong>Groundcrew Brand</strong>
        <span>Copied from the Groundcrew logo concept worktree.</span>
      </a>
    </nav>
  </main>
</body>
</html>
